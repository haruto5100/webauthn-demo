<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【機密】管理者ダッシュボード</title>
    <style>
        /* サイバーテイストな機密ページ専用スタイル */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard-container {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
            backdrop-filter: blur(10px);
        }
        .header {
            border-bottom: 2px solid #ff4444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4444;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8em;
        }
        .data-card {
            background: #000;
            border-left: 4px solid #00ff7f;
            padding: 15px;
            margin: 15px 0;
            font-size: 1.1em;
        }
        .neon-text {
            color: #00ff7f;
            text-shadow: 0 0 5px rgba(0, 255, 127, 0.5);
        }
        .warning-text {
            color: #ff4444;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid #c9d1d9;
            color: #c9d1d9;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            font-family: monospace;
        }
        .btn-logout:hover {
            background: #c9d1d9;
            color: #0d1117;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>CONFIDENTIAL / 極秘領域</h1>
            <p class="warning-text">※このページは生体認証を通過した管理者のみ閲覧可能です。</p>
        </div>
        
        <div class="data-card">
            <p>システム稼働状況: <span class="neon-text">ALL GREEN</span></p>
            <p>アクセス元IP: <span class="neon-text">127.0.0.1</span></p>
        </div>

        <div class="data-card">
            <p><strong>[社内機密データ]</strong></p>
            <p>・開発中データ</p>
            <p>・従業員アカウント情報データベース</p>
        </div>

        <button class="btn-logout" onclick="window.location.href='../index.html'">◀ 認証画面へ戻る</button>
    </div>
</body>
</html>
