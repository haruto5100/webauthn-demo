events {
    # 同時接続数の設定（デフォルトのままでOKです）
    worker_connections 1024;
}

http {
    # CSSやJSなどのファイル形式を正しくブラウザに認識させるための設定
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # 1. 誰でも入れる一般エリア（ログイン画面など）
        # ==========================================
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # ==========================================
        # 2. FastAPIの機能（ログイン処理・登録処理）への通信
        # ==========================================
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # 3. 機密エリア
        # ==========================================
        location /secure/ {
            # アクセスが来たら、まず内部ルート「/auth」に問い合わせる
            auth_request /auth;

            # 302リダイレクトを使って、URLごとトップページに戻す
            error_page 401 =302 /;

            # 認証OK（200）なら、そのままファイルを見せる
            root /usr/share/nginx/html;
        }

        # ==========================================
        # 4. ★NginxとFastAPIの「秘密のホットライン」
        # ==========================================
        location = /auth {
            internal; # ブラウザからURL直打ちで叩かれるのを防ぐ（Nginx内部専用）
            
            # FastAPIの審査用エンドポイントへ問い合わせを投げる
            proxy_pass http://backend:8000/api/verify_session;
            
            # 問い合わせにはボディ（データの中身）は不要なので削る（通信の最適化）
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            # 元々ユーザーがアクセスしようとしていたURL情報を付与しておく
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}