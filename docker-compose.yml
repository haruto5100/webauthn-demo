version: '3.8'

services:
  # ① FastAPIのコンテナ
  backend:
    build: ./backend
    # あえてポートは公開しない（nginxを通してアクセスさせるため）

  # ② Nginxのコンテナ（リバースプロキシ）
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # 全てのアクセスはここを通る
    volumes:
      # 作成した設定ファイルをコンテナに読み込ませる
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # フロントエンドのHTML群をNginxに直接配らせる
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend # backendが立ち上がってからnginxを起動する